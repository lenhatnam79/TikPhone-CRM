<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Affiliate Desk</title>
    <style>
      body {
        margin: 0;
        background: #f6f7f9;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19392b;
      }
      section {
        text-align: center;
      }
      .mark {
        margin: 0 auto 28px;
        background: #226c52;
        color: white;
        font-size: 38px;
        font-weight: 700;
        border-radius: 16px;
        width: 64px;
        height: 64px;
        line-height: 64px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
      }
      p {
        font-size: 13px;
        color: #7b877f;
        line-height: 1.9;
      }
      .spinner {
        margin: 25px auto;
        width: 20px;
        height: 20px;
        border: 2px solid #d6e5db;
        border-top-color: #226c52;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <section>
      <div class="mark">a·</div>
      <h1>Đang mở workspace của bạn</h1>
      <p>Lần khởi động đầu tiên có thể mất một chút thời gian.</p>
      <div class="spinner"></div>
    </section>
  </body>
</html>
